packages:
  - apps/*
  - packages/*

# Desktop application dependencies are bundled; only Forge tooling needs hoisting.
publicHoistPattern:
  - '@electron-forge/*'

allowBuilds:
  electron: true
  electron-winstaller: set this to true or false
  esbuild: true

onlyBuiltDependencies:
  - electron
  - esbuild

patchedDependencies:
  '@embedpdf/engines@2.14.4': patches/@embedpdf__engines@2.14.4.patch
  '@embedpdf/plugin-selection@2.14.4': patches/@embedpdf__plugin-selection@2.14.4.patch
