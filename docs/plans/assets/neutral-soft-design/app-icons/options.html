<div id="pk-icon-options" aria-label="Placekeeper app icon directions">
<style>
#pk-icon-options{--pi-text:light-dark(#333,#e7e7e7);--pi-muted:light-dark(#707070,#aaa);--pi-bed:light-dark(#f1f1f1,#333);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--pi-text);padding:8px 0}
#pk-icon-options *{box-sizing:border-box}
#pk-icon-options .pi-current{display:flex;align-items:center;gap:12px;margin-bottom:24px;font-size:12px;color:var(--pi-muted)}
#pk-icon-options img{display:block;border-radius:22%;flex:none}
#pk-icon-options .pi-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
#pk-icon-options .pi-option{min-width:0}
#pk-icon-options .pi-label{font-size:14px;font-weight:500;margin-bottom:12px}
#pk-icon-options .pi-large{padding:24px 8px;background:var(--pi-bed);border-radius:18px;display:flex;justify-content:center}
#pk-icon-options .pi-large img{width:144px;height:144px;max-width:100%}
#pk-icon-options .pi-size-row{display:flex;align-items:flex-end;justify-content:center;gap:18px;margin-top:20px;min-height:74px}
#pk-icon-options figure{margin:0;text-align:center}
#pk-icon-options figcaption{font-size:11px;color:var(--pi-muted);margin-top:7px}
#pk-icon-options .pi-note{font-size:12px;color:var(--pi-muted);margin-top:12px}
@media(max-width:560px){#pk-icon-options .pi-grid{grid-template-columns:1fr;gap:28px}#pk-icon-options .pi-option{display:grid;grid-template-columns:140px 1fr;gap:0 16px}#pk-icon-options .pi-label{grid-column:1/-1}#pk-icon-options .pi-large{grid-row:2/4;padding:14px}#pk-icon-options .pi-large img{width:112px;height:112px}#pk-icon-options .pi-size-row{gap:12px;margin-top:0;justify-content:flex-start}#pk-icon-options .pi-note{margin-top:8px}}
</style>
