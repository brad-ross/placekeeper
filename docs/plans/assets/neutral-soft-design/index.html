.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {

  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

const longComment=&#x27;Clarify whether precision varies across consumers or across products. The distinction matters for interpreting the comparative static: a change in the information available to a consumer is not necessarily the same experiment as a change in the information available about one product.\n\nPlease state which objects are held fixed when precision changes, and whether the consumer observes the realized signal or only knows its distribution. The current description leaves open whether the information structure is common across alternatives.\n\nThe empirical section could make this concrete with one example. Describe how the observed variation changes posterior beliefs, which choice probabilities respond, and how the resulting moments distinguish information from preferences.\n\nIt would also help to connect this argument to the exclusion restriction below. If the source of variation can affect utility directly, explain which controls or restrictions separate that channel from the information effect. Keep the identifying assumption distinct from the interpretation of the estimated parameter.\n\nFinally, check that the terminology is consistent between the model, identification argument, and appendix. In particular, use precision for the property of the signal distribution and uncertainty for the consumer’s posterior assessment.&#x27;;
const importedComment=&#x27;The exclusion restriction is sufficient under the maintained information structure, but the scope of that conclusion needs to be stated explicitly. The argument conditions on the distribution of preferences and the support of the observed covariates.\n\nPlease explain whether the same restriction remains sufficient when precision varies across both consumers and products. If not, identify the additional variation needed to distinguish those two sources of heterogeneity.\n\nThe appendix should also state the regularity conditions used to interchange limits and expectations. A short explanation of how these conditions apply to the empirical specification would make the connection between the theoretical result and its implementation easier to follow.&#x27;;
let annotationText=longComment;

function refContent(){if(!state.refs)return &#x27;&lt;div class=&quot;pk-empty&quot;&gt;Open a document link in References to keep your reading place.&lt;/div&gt;&#x27;;return `&lt;div class=&quot;pk-ref-tabs&quot; role=&quot;tablist&quot; aria-label=&quot;Open references&quot;&gt;${state.refIds.map(i=&gt;{const t=[&#x27;Proposition 1&#x27;,&#x27;Appendix A&#x27;,&#x27;Lemma A.2&#x27;][i];return `&lt;div class=&quot;pk-ref-tab ${state.ref===i?&#x27;pk-current&#x27;:&#x27;&#x27;}&quot;&gt;&lt;button class=&quot;pk-btn pk-ref-title&quot; role=&quot;tab&quot; aria-selected=&quot;${state.ref===i}&quot; aria-label=&quot;${t}, original destination Page ${[12,14,15][i]}&quot; data-pk-tip=&quot;${esc(t)}, original destination Page ${[12,14,15][i]}&quot; data-action=&quot;ref-${i}&quot;&gt;&lt;span class=&quot;pk-ref-name&quot;&gt;${t}&lt;/span&gt;&lt;span class=&quot;pk-ref-page&quot;&gt;${[12,14,15][i]}&lt;/span&gt;&lt;/button&gt;${state.ref===i?`&lt;div class=&quot;pk-ref-tab-actions&quot;&gt;${btn(&#x27;anchor&#x27;,&#x27;Return to reference&#x27;,&#x27;ref-return&#x27;,&#x27;hidden&#x27;)}${btn(&#x27;send&#x27;,&#x27;Open in main document&#x27;,&#x27;promote&#x27;)}${btn(&#x27;close&#x27;,&#x27;Close reference tab&#x27;,&#x27;close-ref&#x27;)}&lt;/div&gt;`:&#x27;&#x27;}&lt;/div&gt;`;}).join(&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;pk-ref-body&quot; data-ref-id=&quot;${state.ref}&quot; data-ref-page=&quot;${state.refPage}&quot;&gt;&lt;div class=&quot;pk-running&quot;&gt;&lt;span&gt;${[&#x27;Proposition 1&#x27;,&#x27;Appendix A&#x27;,&#x27;Lemma A.2&#x27;][state.ref]}&lt;/span&gt;&lt;span&gt;${state.refPage}&lt;/span&gt;&lt;/div&gt;&lt;h3 data-reference-anchor&gt;${state.refPage===13?&#x27;Corollary 1&#x27;:state.ref?&#x27;Proof of Proposition 1&#x27;:&#x27;Proposition 1&#x27;}&lt;/h3&gt;&lt;p&gt;Suppose that the signal satisfies the monotone likelihood ratio property. An increase in precision then shifts the distribution of posterior beliefs.&lt;/p&gt;&lt;p&gt;The r
