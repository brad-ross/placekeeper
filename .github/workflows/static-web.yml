name: Static web pull request

on:
  pull_request:
    paths:
      - ".github/workflows/static-web.yml"
      - ".github/workflows/deploy-pages.yml"
      - "apps/web/**"
      - "apps/chrome-extension/scripts/embedpdf-worker-source.ts"
      - "packages/**"
      - "scripts/**"
      - "test/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - "vite*.config.*"
      - "playwright*.config.ts"
      - "THIRD_PARTY_NOTICES.md"

concurrency:
  group: static-web-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  static-web:
    name: Static web / Chromium critical
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.16.0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.14.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run the bounded static gate
        run: pnpm test:static:pr
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: static-web-pr-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/static-web/
            playwright-report/static-web/
          if-no-files-found: ignore
          retention-days: 3
