name: Diagnose Linux WebKit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps webkit
      - name: Probe native clipboard independently of Placekeeper
        run: |
          node --input-type=module <<'JS'
          import { webkit } from '@playwright/test';
          const browser = await webkit.launch();
          const page = await browser.newPage();
          page.on('console', message => console.log(message.text()));
          await page.setContent('<textarea id="input">native clipboard control</textarea><span id="bridge" style="position:fixed;left:-10000px">semantic bridge control</span><textarea id="paste"></textarea>');
          await page.evaluate(() => {
            for (const kind of ['copy', 'paste', 'keydown']) document.addEventListener(kind, event => console.log(JSON.stringify({ kind, key: event.key, ctrl: event.ctrlKey, meta: event.metaKey, selection: String(getSelection()), active: document.activeElement?.id })), true);
          });
          for (const modifier of ['Control', 'Meta']) {
            await page.locator('#input').selectText();
            await page.keyboard.press(`${modifier}+c`);
            await page.locator('#paste').fill('');
            await page.keyboard.press(`${modifier}+v`);
            console.log(JSON.stringify({ modifier, controlPaste: await page.locator('#paste').inputValue() }));
            await page.evaluate(() => {
              document.activeElement.blur();
              const range = document.createRange(); range.selectNodeContents(document.querySelector('#bridge'));
              getSelection().removeAllRanges(); getSelection().addRange(range);
            });
            await page.keyboard.press(`${modifier}+c`);
            await page.locator('#paste').fill('');
            await page.keyboard.press(`${modifier}+v`);
            console.log(JSON.stringify({ modifier, bridgePaste: await page.locator('#paste').inputValue() }));
          }
          for (const scenario of ['visible', 'offscreen', 'focused', 'exec-command', 'empty-exec-command']) {
            await page.setContent('<span id="bridge" tabindex="-1">semantic bridge control</span><textarea id="paste"></textarea>');
            await page.evaluate(scenario => {
              document.addEventListener('copy', event => {
                console.log('COPY-PROBE', scenario, String(getSelection()));
                if (scenario === 'empty-exec-command') { event.preventDefault(); event.clipboardData.setData('text/plain', 'pending handler control'); }
              });
              const bridge = document.querySelector('#bridge');
              if (scenario !== 'visible') bridge.style.cssText = 'position:fixed;left:-10000px';
              if (scenario === 'focused') bridge.focus({ preventScroll: true });
              if (scenario !== 'empty-exec-command') {
                const range = document.createRange(); range.selectNodeContents(bridge);
                getSelection().removeAllRanges(); getSelection().addRange(range);
              }
              if (scenario.includes('exec-command')) document.addEventListener('keydown', event => {
                if (event.ctrlKey && event.key === 'c') {
                  event.preventDefault(); console.log('EXEC-COPY', document.execCommand('copy'));
                }
              });
            }, scenario);
            await page.keyboard.press('Control+c');
            await page.locator('#paste').focus();
            await page.keyboard.press('Control+v');
            console.log(JSON.stringify({ scenario, pasted: await page.locator('#paste').inputValue() }));
          }
          await browser.close();
          JS
      - name: Add temporary reference navigation diagnostics
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          p = Path('apps/web/src/review/navigation-coordinator.ts')
          s = p.read_text().replace('if (!opened) return failPreservingMain();', "if (!opened) { console.log('REF-DIAG controller-open-failed'); return failPreservingMain(); }")
          s = s.replace('if (!navigation) return failPreservingMain();', "if (!navigation) { console.log('REF-DIAG navigation-not-ready'); return failPreservingMain(); }")
          s = s.replace('if (settledLocation === null) return failPreservingMain();', "if (settledLocation === null) { console.log('REF-DIAG target-not-settled'); return failPreservingMain(); }")
          s = s.replace("const applied = await navigation.applyTarget(target, 'reference-fit-width');", "const applied = await navigation.applyTarget(target, 'reference-fit-width'); console.log('REF-DIAG target', applied, navigation.captureLocation());")
          p.write_text(s)
          p = Path('apps/web/src/pdf/reference-document.ts')
          s = p.read_text().replace('} catch {', "} catch (error) { console.log('REF-DIAG document', error);")
          p.write_text(s)
          PYTHON
      - run: pnpm fixtures:pdf && pnpm build
      - name: Add temporary event diagnostics
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          p = Path('test/acceptance/production-flow.spec.ts')
          s = p.read_text().replace('test.beforeEach(async () => {', """test.beforeEach(async ({ page }, testInfo) => {
            page.on('console', message => console.log(testInfo.title, message.type(), message.text()));
            page.on('pageerror', error => console.log('PAGEERROR', error.message));
            page.on('requestfailed', request => console.log('REQUESTFAILED', request.url(), request.failure()));
            await page.addInitScript(() => {
              const describe = (element: Element | null) => element ? [element.tagName, element.getAttribute('aria-label'), element.getAttribute('data-workspace-focus-token')].join(':') : null;
              for (const kind of ['focusin', 'focusout', 'copy', 'keydown', 'pointerdown']) document.addEventListener(kind, event => {
                if (kind === 'keydown' && !['Control', 'Meta', 'c', 'C', 'Enter', 'Escape'].includes((event as KeyboardEvent).key)) return;
                console.log('DIAGNOSTIC', JSON.stringify({ kind, key: (event as KeyboardEvent).key, target: describe(event.target as Element), active: describe(document.activeElement), selection: String(getSelection()).slice(0, 100), scroll: document.querySelector('[data-viewer-framing-viewport]')?.scrollTop }));
              }, true);
            });""")
          p.write_text(s)
          PYTHON
      - name: Run remaining failing cases with traces
        run: >-
          pnpm exec playwright test --config scripts/testing/config/playwright.webkit.config.ts
          test/acceptance/production-flow.spec.ts test/acceptance/reloadable-links.spec.ts
          --grep 'restores Search focus.*wide|opens the annotations tray without moving|keeps compound reference actions in narrow|defaults a real PDF to fit width|copies a real .* Main PDF selection|keeps prior clipboard|copies exactly 12|rejects a real 13|copies only the focused|animates toolbar zoom|copies canonical PDF destinations'
          --trace on
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-webkit-diagnostics
          path: test-results/
          retention-days: 7
