name: CI

# Temporarily manual-only. Restore the pull_request and push triggers to re-enable CI.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check generated mathematical symbol catalog
        run: pnpm catalog:check
      - name: Generate full mathematical symbol catalog audit
        run: pnpm catalog:audit
      - name: Upload mathematical symbol catalog audit
        uses: actions/upload-artifact@v4
        with:
          name: mathematical-symbol-catalog-audit
          path: scripts/pdf-symbol-catalog/generated/catalog.audit.json
          if-no-files-found: error
          retention-days: 14
      - name: Typecheck
        run: pnpm typecheck
      - name: Install Playwright browsers and system dependencies
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Generate PDF fixtures
        run: pnpm fixtures:pdf
      - name: Build shared client distributions
        run: pnpm build
      - name: Run canonical unit tests
        run: pnpm test:ci:unit
      - name: Run targeted WebKit annotation tests
        run: >-
          pnpm exec playwright test --config scripts/testing/config/playwright.webkit.config.ts
          test/acceptance/production-flow.spec.ts test/acceptance/annotation-behavior-followup.spec.ts test/acceptance/review-workflow.spec.ts
          --grep 'selected compact popup offers return|full delete popup retains|returns a live PDF annotation preview|creates one atomic cross-page Delete|shows and hides annotation hover previews without timers'
          --repeat-each 3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: annotation-diagnostic-artifacts
          path: test-results/
          retention-days: 7
      - name: Run visual regression tests
        if: success() || failure()
        run: pnpm test:ci:visual
      - name: Validate distribution manifest
        if: success() || failure()
        run: pnpm validate:distribution
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
