name: CI

# Temporarily manual-only. Restore the pull_request and push triggers to re-enable CI.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check generated mathematical symbol catalog
        run: pnpm catalog:check
      - name: Generate full mathematical symbol catalog audit
        run: pnpm catalog:audit
      - name: Upload mathematical symbol catalog audit
        uses: actions/upload-artifact@v4
        with:
          name: mathematical-symbol-catalog-audit
          path: scripts/pdf-symbol-catalog/generated/catalog.audit.json
          if-no-files-found: error
          retention-days: 14
      - name: Typecheck
        run: pnpm typecheck
      - name: Install Playwright browsers and system dependencies
        if: github.event_name == 'pull_request'
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Generate PDF fixtures
        if: github.event_name == 'pull_request'
        run: pnpm fixtures:pdf
      - name: Run canonical unit tests
        if: github.event_name == 'pull_request'
        run: pnpm test:ci:unit
      - name: Build web distribution
        if: github.event_name == 'pull_request'
        run: pnpm build:web
      - name: Run Chromium acceptance tests
        if: github.event_name == 'pull_request'
        run: pnpm test:ci:chromium
      - name: Run WebKit acceptance tests
        if: github.event_name == 'pull_request'
        run: pnpm test:ci:webkit
      - name: Run visual regression tests
        if: github.event_name == 'pull_request'
        run: pnpm test:ci:visual
      - name: Validate distribution manifest
        if: github.event_name == 'pull_request'
        run: pnpm validate:distribution
      - name: Upload Playwright failure artifacts
        if: failure() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
