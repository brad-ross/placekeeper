name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium webkit
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:pdf-conformance
      - run: pnpm test:service
      - run: pnpm test:u4
      - run: pnpm test:u5
      - run: pnpm test:u6
      - run: pnpm test:u7-host
      - run: pnpm test:e2e
      - run: pnpm test:e2e:webkit
      - run: pnpm validate:distribution
