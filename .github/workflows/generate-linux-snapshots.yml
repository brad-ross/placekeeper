name: Generate Linux visual baselines

on:
  push:
    branches:
      - codex/reduce-ci-minutes

permissions:
  contents: read

jobs:
  snapshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Generate deterministic PDF fixtures
        run: pnpm fixtures:pdf

      - name: Build web application
        run: pnpm build:web

      - name: Generate Linux visual baselines
        run: pnpm exec playwright test --config playwright.visual.config.ts --update-snapshots=changed

      - name: Upload Linux visual baselines
        uses: actions/upload-artifact@v4
        with:
          name: linux-visual-baselines
          path: test/acceptance/review-visual.spec.ts-snapshots/*-linux.png
          if-no-files-found: error
          retention-days: 1
