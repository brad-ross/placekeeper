name: Release macOS

on:
  workflow_dispatch:
    inputs:
      installed_chrome_evidence:
        description: Final JSON from test:chrome-installed for this exact build
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15
    env:
      RELEASE_ARCH: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate:distribution
      - run: pnpm fixtures:pdf
      - run: pnpm build
      - name: Validate macOS packaging contracts
        run: pnpm exec vitest run packaging/macos/packaging.test.ts
      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: scripts/ci/import-signing-certificate.sh
      - name: Build and sign app
        env:
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: pnpm package:macos -- --arch "$RELEASE_ARCH" --node-runtime "$(command -v node)" --service-dist dist/service --web-dist dist/web --output "artifacts/$RELEASE_ARCH" --sign-identity "$SIGNING_IDENTITY"
      - name: Installed offline writer smoke
        run: pnpm smoke:installed -- "artifacts/$RELEASE_ARCH/Placekeeper.app" test/fixtures/pdfs/text-native.pdf
      - name: Verify installed Google Chrome release evidence
        env:
          PLACEKEEPER_INSTALLED_CHROME_EVIDENCE: ${{ inputs.installed_chrome_evidence }}
        run: pnpm exec tsx test/acceptance/validate-installed-chrome-evidence.ts "artifacts/$RELEASE_ARCH/Placekeeper.app"
      - name: Archive signed app
        run: ditto -c -k --keepParent "artifacts/$RELEASE_ARCH/Placekeeper.app" "artifacts/Placekeeper-$RELEASE_ARCH-submission.zip"
      - name: Notarize and staple
        env:
          PLACEKEEPER_NOTARY_PROFILE: ${{ secrets.MACOS_NOTARY_PROFILE }}
        run: pnpm notarize:macos -- "artifacts/Placekeeper-$RELEASE_ARCH-submission.zip" "artifacts/$RELEASE_ARCH/Placekeeper.app"
      - name: Archive stapled app
        run: ditto -c -k --keepParent "artifacts/$RELEASE_ARCH/Placekeeper.app" "artifacts/Placekeeper-$RELEASE_ARCH.zip"
      - name: Gatekeeper assessment
        run: spctl --assess --type execute --verbose=4 "artifacts/$RELEASE_ARCH/Placekeeper.app"
      - uses: actions/upload-artifact@v4
        with:
          name: Placekeeper-arm64
          path: artifacts/Placekeeper-arm64.zip
          if-no-files-found: error
