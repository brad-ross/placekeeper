  <title id="title">Placekeeper — Soft pages</title>
  <desc id="desc">Two closely tucked soft pages on a standard rounded macOS app-icon tile. The back page is raised slightly and extends diagonally behind the front sheet, with its upper and lower corners concealed. A muted blue path visits an amber dot and returns to the front page.</desc>
