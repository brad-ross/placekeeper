    <rect x="18" y="19" width="184" height="184" rx="45" opacity="0.06" />
    <rect x="21" y="22" width="178" height="178" rx="43" opacity="0.09" />
  </g>
  <rect x="22" y="22" width="176" height="176" rx="42" fill="#ededed" />
